name: Build binary

# Builds the standalone 'denver' executable and uploads it as an artifact.
# Called by release-binary.yml (which attaches it to the release) and by
# examples.yml (which runs every example env with it) -- so the executable
# those examples exercise is built by exactly the recipe that ships, rather
# than a lookalike that can drift away from it.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit/tag/branch to build. Empty: whatever triggered the caller.'
        type: string
        required: false
        default: ''
      artifact:
        description: 'Name of the uploaded artifact'
        type: string
        required: false
        default: denver-binary

jobs:
  build:
    runs-on: ubuntu-latest
    # A PyInstaller binary links the glibc of the machine that built it, and
    # glibc is only backward compatible -- built on ubuntu-latest it would
    # refuse to start on anything older than that runner. AlmaLinux 8 has
    # glibc 2.28, the oldest that still runs the node20 the actions below
    # need, which covers every distro from Ubuntu 20.04 / Debian 10 /
    # Fedora 29 / RHEL 8 onwards. glibc-based distros only -- musl ones
    # (Alpine) can never run this binary.
    container: almalinux:8
    steps:
      # Before the checkout -- without git, actions/checkout silently falls
      # back to downloading a tarball, and a checkout with no .git has no
      # tags for setuptools-scm to derive the version from.
      - name: Install build prerequisites
        run: dnf -y install python3.12 python3.12-pip git tar xz

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # the version frozen into the binary comes from the tags, and the
          # default shallow checkout fetches none of them.
          fetch-depth: 0

      # the checkout is owned by a different user than this container's root,
      # which git refuses to read from until told it is not a security issue.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the executable
        run: scripts/create-python-exe.sh --output dist --python python3.12

      # the .tar.xz rather than the bare executable. It is what a release
      # actually ships, and unlike a zipped artifact it keeps the exec bit,
      # so consumers just untar and run it.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: dist/denver_x64_Linux.tar.xz
          if-no-files-found: error
