name: Release binary

# Builds the single-file 'denver' executable (see scripts/create-python-exe.sh)
# and attaches denver-<version>-x64-linux.tar.xz to the release, so denver can
# be used on a machine that has no python -- and no pip, no uv -- at all.
#
# Separate from publish.yml on purpose. That one is triggered by the tag push
# and uploads to PyPI, while attaching an asset needs the GitHub *release* to
# already exist, which is only guaranteed once it is published.
on:
  release:
    types: [published]
  # on-demand -- builds and verifies without touching any release. Give 'tag'
  # to also (re-)attach the asset to an existing release, e.g. after fixing
  # the build for one already published.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build from and attach the asset to (empty: build + verify only)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  # The release this builds. Its tag is what setuptools-scm turns into the
  # version frozen into the binary, so checking out anything else would
  # produce an executable that misreports itself. Empty on a plain
  # workflow_dispatch -- then the triggering ref is built as-is.
  REF: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

jobs:
  # the glibc floor and every other build decision live there, shared with
  # examples.yml so both exercise the same executable. 'env.REF' is not
  # available to a reusable workflow's inputs, so the ref is spelled out again.
  build:
    uses: ./.github/workflows/build-binary.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      artifact: denver-binary

  # Proves the "runs on any x86_64 Linux" claim rather than assuming it. The
  # binary is dropped into stock distro images that have no python installed,
  # and has to run an example end to end there.
  verify:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          # the glibc floor it was built against, and the oldest still-
          # supported LTS releases -- the ones a modern-runner build breaks
          - almalinux:8
          - ubuntu:20.04
          - debian:11
          # ... plus the current end of the range, where a binary built too
          # old would fail instead
          - ubuntu:24.04
          - fedora:latest
          - archlinux:latest
    steps:
      - uses: actions/checkout@v4
        with:
          # only for examples/simple-env below; the binary carries its own
          # version, so this checkout needs no tags.
          ref: ${{ env.REF }}

      - uses: actions/download-artifact@v4
        with:
          name: denver-binary

      # Named denver-<version>-x64-linux.tar.xz -- resolved by glob since the
      # version isn't known here.
      - name: Unpack
        run: tar -xf denver-*-x64-linux.tar.xz

      # Unpacked on the runner and mounted in, so the distro images need
      # neither tar/xz nor anything else to take part -- the point is that
      # only the binary is required. 'denver' is now a symlink to the
      # versioned binary, so both have to be mounted together (into PATH)
      # rather than just the single file -- a lone symlink mount would
      # dangle, pointing at a sibling that was never brought along.
      # '-c denver-version=null' drops the example's own pin, which a
      # workflow_dispatch build off an untagged commit cannot satisfy (see
      # ci.yml's smoke test for the full why).
      - name: Run on ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            ${{ matrix.image }} \
            sh -c 'export PATH="/work:$PATH"; denver --version && denver /work/examples/simple-env -c denver-version=null -- echo "denver runs on ${{ matrix.image }}"'

  upload:
    # 'build' listed directly (not just transitively via 'verify') because a
    # job's outputs are only visible to jobs that name it in 'needs'.
    needs: [build, verify]
    # nothing to attach when workflow_dispatch ran without a tag
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: denver-binary

      # --clobber so re-running against an already-attached release replaces
      # the asset instead of failing halfway. The filename is composed from
      # 'build's version output -- this is the point that actually names the
      # release asset, so it uses the real version rather than a glob.
      - name: Attach denver-${{ needs.build.outputs.version }}-x64-linux.tar.xz to ${{ env.REF }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: denver-${{ needs.build.outputs.version }}-x64-linux.tar.xz
        run: gh release upload "$REF" "$ARCHIVE" --clobber
