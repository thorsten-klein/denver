version: "1.0"
# minimum denver (the tool) this env needs -- see doc/cli/configuration.md
denver-version: ">=1.1.0"

# Builds denver's own doc/ tree (see doc/conf.py) with Sphinx: a uv venv with
# the tools sphinx-build needs, then a custom stage that runs it against the
# real doc/ folder -- twice, once per builder (HTML for people, Markdown for
# AI tools/LLMs), the Markdown output copied into the HTML output's
# markdown/ subdirectory so one publish step carries both. This is the
# actual recipe -- the top-level 'docs' poe task and .github/workflows/docs.yml
# both just run this env rather than calling sphinx-build themselves. Every
# run rebuilds doc/_build/html -- 'denver examples/doc-env -- echo Done'
# both builds the docs and confirms it succeeded; 'denver examples/doc-env'
# (no trailing command) rebuilds them and drops into a shell with
# sphinx-build on PATH.
stages:
- docs-tools
- build-docs

command: bash

docs-tools:
  provider: uv
  description:
  - The Sphinx/MyST/Read-the-Docs-theme venv doc/conf.py needs, pinned in requirements.txt.
    Deliberately standalone rather than depending on the repo's own uv
    project -- the top-level project has no 'docs' dependency-group.
  # no 'python:' pin -- unlike a firmware toolchain, sphinx-build doesn't
  # care which interpreter built its venv, so there's nothing worth pinning
  # (and pinning would force an exact match against a *container's* baked-in
  # python3 whenever denver runs inside one -- see "One venv, one
  # interpreter" in doc/providers/uv.md). uv's own discovery picks one.
  requirements:
  - requirements.txt

build-docs:
  provider: custom
  description:
  - Runs sphinx-build against the repo's real doc/ tree, right after
    'docs-tools' activates the venv that provides it -- once with the html
    builder, once with the markdown one (AI/LLM-friendly mirror), the latter
    copied under the former's own output. Not fingerprinted -- like any
    custom 'cmd:', it reruns every time, which is exactly what a doc build
    wants.
  cmd: |
    set -euo pipefail
    DOC="${DENVER_ENV_DIR}/../../doc"
    sphinx-build -b html -W --keep-going "$DOC" "$DOC/_build/html"
    sphinx-build -b markdown -W --keep-going "$DOC" "$DOC/_build/markdown"
    rm -rf "$DOC/_build/html/.doctrees" "$DOC/_build/markdown/.doctrees"
    rm -rf "$DOC/_build/html/markdown"
    cp -r "$DOC/_build/markdown" "$DOC/_build/html/markdown"
