version = "1.0"
denver-version = ">=1.5.1"

# The environment built step by step in doc/quickstart/30-minutes.md.
# Every stage id here is named after the problem it solves rather than after its
# provider -- an id is only a label, the section below always declares
# 'provider:' itself.
stages = [
  "docker-base",     # 1. Ubuntu 24.04 + the apt packages + uv
  "uv-packages",     # 2. the python 3.12 venv
  "nvim-setup",      # 3. one prebuilt release, fetched by hand
  "ninja-setup",     # 4. one prebuilt release, fetched by the 'download' provider
  "conan-packages",  # 5. cmake 3.31.9, exactly
  "best-practices",  # 6. the team's PYTEST_ADDOPTS/CMAKE_GENERATOR conventions
]

# what the finished environment starts when no command follows '--'
command = "bash"

# conan's cache, kept next to this env rather than thrown away with the
# --rm container -- forwarded into docker-compose.yml as ${CONAN_HOME}.
[env]
CONAN_HOME = "${DENVER_ENV_DIR}/.conan2"

# writes the compose .env file (host UID/GID, and a container-only $HOME --
# see create-env.sh) right before the 'docker-base' stage's setup() (build/run).
[hooks]
pre-docker-base = ["create-env.sh"]

[docker-base]
provider = "docker"
description = [
  "Relocates every stage below into an Ubuntu 24.04 container, so the OS and the apt packages are the same for everyone.",
]
[docker-base.compose]
file = "docker-compose.yml"
service = "dev"

# one-time host bootstrap: `denver run examples/firmware-env --scripts setup`
[docker-base.scripts]
setup = ["setup/install_host_tools.sh"]

[uv-packages]
provider = "uv"
description = [
  "The python 3.12 virtualenv. 'conan' is in requirements.txt because the next stage needs it on PATH -- the conan provider never installs it.",
]
# inside a docker-wrapped env the interpreter is whatever the image has --
# denver can't install another one in there, so this must match the
# container's `python3 --version` exactly (Ubuntu 24.04: 3.12.3).
python = "3.12.3"
requirements = ["requirements.txt"]

[nvim-setup]
provider = "custom"
description = [
  "Brings one prebuilt binary release (neovim 0.12.4) into the environment the manual way -- download, checksum, unpack, PATH -- so the stage below can be read as what conan does with that same job.",
]
# the build step: an isolated subprocess, so it prints what it does and is
# skipped by --fast. It inherits denver's working directory (wherever the
# user was), hence ${DENVER_ENV_DIR} rather than a relative path.
cmd = "bash ${DENVER_ENV_DIR}/nvim/install.sh"
# the activation: sourced, so its PATH entry survives into every later
# stage and the final command. Resolved relative to this denver.toml.
# (Both halves in one sourced script would work too -- see
# doc/quickstart/30-minutes.md; split here because the two jobs
# are worth seeing apart.)
source = "nvim/activate.sh"

[ninja-setup]
provider = "download"
description = [
  "The same job as 'nvim-setup' above, minus the two shell scripts -- the 'download' provider owns the download, the checksum, the unpacking and the PATH entry. One entry per prebuilt release.",
]

[[ninja-setup.packages]]
name = "ninja"
url = "https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip"
sha256sum = "5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6"
env-prepend = { PATH = "." }

[conan-packages]
provider = "conan"
description = [
  "Downloads cmake at exactly the pinned version and puts it on PATH. One conanfile plus the recipe it installs. The same job as 'nvim-setup' above, minus the shell script -- conan owns the download, the checksum, the cache and the PATH.",
]
conanfile = "conan/conanfile.py"

[[conan-packages.recipes]]
dirs = ["conan/recipes"]

[best-practices]
provider = "custom"
description = [
  "Team conventions -- pytest always verbose with live logs, and cmake building with the ninja from 'ninja-setup' rather than make. Declared as 'source:' rather than 'cmd:', so the exports survive into the final command.",
]
source = "best-practices.sh"
