services:
  dev:
    build:
      context: container
      dockerfile: Dockerfile

    # HOST_UID/HOST_GID/HOST_HOME come from .env, written by create-env.sh
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}

    env_file:
    - .env

    # DENVER_ENV_DIR is exported by denver itself before build/run, so the
    # final `pytest` starts in this env's own directory
    working_dir: ${DENVER_ENV_DIR:-/tmp}

    # trust the host's OS CA bundle for corporate TLS-interception proxies --
    # Python's bundled certifi (used by requests/urllib3, hence conan) never
    # includes a private root, only the OS trust store does
    environment:
    - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
    - CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt

    volumes:
    # mount the home dir from host at the same path inside and out, so absolute paths inside docker match with host paths
    - ${HOST_HOME}:${HOST_HOME}
    # conan's cache, at the same path inside and out. create-env.sh decides
    # the path, creates the dir and writes CONAN_HOME into .env -- which is
    # both what interpolates here and what sets it inside the container
    - ${CONAN_HOME}:${CONAN_HOME}
    # host's OS CA trust store (may include a corporate MITM proxy root) --
    # mounted read-only, pointed at by SSL_CERT_FILE/REQUESTS_CA_BUNDLE above
    - /etc/ssl/certs:/etc/ssl/certs:ro
