version: 1.0

stages:
- pip
- conan

pip:
  provider: pip
  requirements:
  - requirements.txt

conan:
  provider: conan
  base-classes:
  - ../zephyr-devshell/conan/base_classes # reuse conan base classes
  recipe-dirs:
  - conan/recipes
  - ../zephyr-devshell/conan/recipes # reuse other conan recipes
  conanfiles:
  - conan/conanfile.py
  # let conan apt-install a recipe's system_tools_requires (pico-sdk needs
  # cmake to build picotool) instead of only checking that it's there
  install-args:
  - -c
  - tools.system.package_manager:mode=install
  - -c
  - tools.system.package_manager:sudo=True
