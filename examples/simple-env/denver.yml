version: "1.0"
# minimum denver (the tool) this env needs -- see doc/architecture.md
denver-version: ">=1.1.0"

# Dummy example: stage-to-stage env propagation via the custom provider's
# 'source:' key -- scoped to the 'set-vars' stage's own section, not the
# global hooks: mechanism (see src/denver_providers/custom.py's module docstring
# for 'source:', and src/denver.py's own module docstring for 'hooks:').
#
# Why not just 'cmd:' on 'set-vars': a 'provider: custom' stage's own 'cmd:'
# runs via ctx.run() as an isolated subprocess -- any 'export FOO=1' it does
# dies with that subprocess, denver never sees it. 'source:' is different:
# denver *sources* that script (ctx.source()), folding whatever it exports
# back into ctx.env -- that's what makes MYVAR/FOO/BAR visible to
# 'print-vars-after' below (and the final command).

# This env's own command-line flag: one argparse.add_argument entry, so
# `denver examples/simple-env --help` lists it like any denver flag, and
# what the user passes arrives as DENVER_ARG_GREETING below (see
# "Environment-specific CLI arguments" in doc/architecture.md).
args:
- flags: [--greeting, -g]
  default: hello
  help: what the last stage greets with

stages:
- print-vars-before
- set-vars
- print-vars-after

print-vars-before:
  provider: custom
  cmd: |
    echo "[print-vars-before] MYVAR=$MYVAR FOO=$FOO BAR=$BAR"

set-vars:
  provider: custom
  cmd: |
    echo "[set-vars] sourcing custom.sh..."
  source: custom.sh

print-vars-after:
  provider: custom
  # ${DENVER_ARG_GREETING} and $MYVAR are expanded by two different things:
  # the first by denver itself, before this line is ever handed to a shell
  # (so --greeting's value is baked in here), the second by that shell,
  # from what 'set-vars' exported above.
  cmd: |
    echo "[print-vars-after] MYVAR=$MYVAR FOO=$FOO BAR=$BAR greeting=${DENVER_ARG_GREETING}"
