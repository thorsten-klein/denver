version: 1.0
# minimum denver version needed
denver-version: ">=1.6.0"

# Single-file version of zephyr-devshell-4.3.1, with no docker and no conan.
# See README.md for details.

# fish is our shell. Say it explicitly since there's no docker stage to guess it from.
command: fish

stages:
- host-tools
- native-tools
- zephyr-sdk-download
- zephyr-sdk
- jlink
- uv
- zephyr
- uv-zephyr

# Shared paths, used by the zephyr-sdk and jlink stages below.
env:
  ZEPHYR_SDK_INSTALL_DIR: "${DENVER_ENV_WORKDIR}/download/zephyr-sdk-minimal"
  JLINK_DIR: "${DENVER_ENV_WORKDIR}/jlink"

# Checks the apt packages this env needs (git, gperf, a device tree compiler, ...).
# Install them once via: denver run examples/zephyr-devshell-4.3.1-simple --scripts setup
host-tools:
  provider: custom
  description:
  - Checks the required apt packages are installed.
  cmd: bash ${DENVER_ENV_DIR}/setup/check_host_tools.sh
  scripts:
    setup:
    - setup/install_host_tools.sh

# Downloads prebuilt tool archives instead of building them with conan.
native-tools:
  provider: download
  packages:
  - name: cmake
    url: https://github.com/Kitware/CMake/releases/download/v3.31.9/cmake-3.31.9-linux-x86_64.tar.gz
    md5sum: 7c102bf491091679895362bb8ae3f4bb
    unpack-cmd: 'tar -xf "$DENVER_DOWNLOAD_ARCHIVE" --strip-components=1'
    env-prepend:
      PATH: "${DENVER_UNPACK_DIR}/bin:"
  - name: ninja
    url: https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
    md5sum: 54a25b8d5b5bed15c1bf051a629b42bb
    env-prepend:
      PATH: "${DENVER_UNPACK_DIR}:"
  - name: clang
    description: clang, clang++, lld, plus a ld -> ld.lld symlink.
    url: https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.4/LLVM-21.1.4-Linux-X64.tar.xz
    md5sum: bc42e986dbe585461fb837542769bc7a
    unpack-cmd: 'tar -xf "$DENVER_DOWNLOAD_ARCHIVE" --strip-components=1 && ln -sf ld.lld bin/ld'
    env-prepend:
      PATH: "${DENVER_UNPACK_DIR}/bin:"
  - name: fish
    description: The shell the final command hands off to.
    url: https://github.com/fish-shell/fish-shell/releases/download/4.8.1/fish-4.8.1-linux-x86_64.tar.xz
    md5sum: 921a8b099fa64d8565b27ffcb588c540
    env-prepend:
      PATH: "${DENVER_UNPACK_DIR}:"
  - name: doxygen
    url: https://github.com/doxygen/doxygen/releases/download/Release_1_15_0/doxygen-1.15.0.linux.bin.tar.gz
    md5sum: 72f0b4d9b5280f28be54745a815d8a74
    unpack-cmd: 'tar -xf "$DENVER_DOWNLOAD_ARCHIVE" --strip-components=1'
    env-prepend:
      PATH: "${DENVER_UNPACK_DIR}/bin:"
  - name: protoc
    url: https://github.com/protocolbuffers/protobuf/releases/download/v33.2/protoc-33.2-linux-x86_64.zip
    md5sum: 6c39e1779a3b830f583214b691b4b7d4
    env-prepend:
      PATH: "${DENVER_UNPACK_DIR}/bin:"
  - name: systemview
    url: https://www.segger.com/downloads/jlink/SystemView_Linux_V362b_x86_64.tgz
    md5sum: c4e790c320566ec0bac903edf714af2f
    unpack-cmd: 'tar -xf "$DENVER_DOWNLOAD_ARCHIVE" --strip-components=1'
    env-prepend:
      PATH: "${DENVER_UNPACK_DIR}:"

# ccache is not listed here -- it's built from source by conan elsewhere,
# so this env just installs it from apt instead (see host-tools above).

# The Zephyr SDK ships as 4 archives (a base plus arm/riscv64/x86_64
# toolchains). Each is downloaded on its own, then put together below.
zephyr-sdk-download:
  provider: download
  packages:
  - name: zephyr-sdk-minimal
    url: https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.4/zephyr-sdk-0.17.4_linux-x86_64_minimal.tar.xz
    md5sum: c62ad59d0b92fd2ede022b774c770102
    unpack-cmd: 'tar -xf "$DENVER_DOWNLOAD_ARCHIVE" --strip-components=1'
  - name: zephyr-toolchain-arm-zephyr-eabi
    url: https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.4/toolchain_linux-x86_64_arm-zephyr-eabi.tar.xz
    md5sum: 68ae71edc0106c3093055b97aaa47017
    unpack-cmd: 'tar -xf "$DENVER_DOWNLOAD_ARCHIVE"'
  - name: zephyr-toolchain-riscv64-zephyr-elf
    url: https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.4/toolchain_linux-x86_64_riscv64-zephyr-elf.tar.xz
    md5sum: afc1120b6b3cf0a2e9196aea76b3f734
    unpack-cmd: 'tar -xf "$DENVER_DOWNLOAD_ARCHIVE"'
  - name: zephyr-toolchain-x86_64-zephyr-elf
    url: https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.4/toolchain_linux-x86_64_x86_64-zephyr-elf.tar.xz
    md5sum: aee015389a3c4a2ecc23834d1e5601a5
    unpack-cmd: 'tar -xf "$DENVER_DOWNLOAD_ARCHIVE"'

# Puts the 3 toolchains into the minimal SDK's tree, then runs its setup.sh.
zephyr-sdk:
  provider: custom
  description:
  - Assembles the Zephyr SDK from the archives fetched above.
  cmd: "${DENVER_ENV_DIR}/setup/setup_zephyr_sdk.sh"
  depends-on:
  - zephyr-sdk-download

# JLink's download needs accepting a license first, so it can't be a plain
# 'download' package like the tools above.
jlink:
  provider: custom
  description:
  - Downloads SEGGER J-Link (JLinkExe, JLinkGDBServerCLExe).
  cmd: "${DENVER_ENV_DIR}/setup/download_jlink.sh"
  # libjlinkarm.so needs LD_LIBRARY_PATH too, not just PATH.
  env-prepend:
    PATH: "${JLINK_DIR}/bin:"
    LD_LIBRARY_PATH: "${JLINK_DIR}/bin:"

# The Python venv, west included. Always online, so no offline wheel cache.
uv:
  provider: uv
  python: "3.12.3"
  requirements:
  - uv/requirements.txt
  - uv/requirements-from-git.txt
  overrides:
  - uv/overrides.txt
  skip-on-success:
  - uv/skip-on-success.sh
  patches-apply:
  - venv-patcher
  - apply
  - -f
  - uv/venv-patcher/patches.yml

zephyr:
  provider: zephyr
  # This env ships its own west manifest, so it runs anywhere.
  west-yml: west.yml
  topdir: ${DENVER_ENV_DIR}
  # Installs the JLink udev rule. Run manually via --scripts setup.
  scripts:
    setup:
    - setup/install_jlink_udev_rules.sh

# Installs the pip packages `west packages pip` reports, into the same venv
# the 'uv' stage above set up.
uv-zephyr:
  provider: uv
  install-args:
  - $(west packages pip)
  overrides:
  - uv/overrides.txt

hooks:
  env:
  - hooks/env.sh
