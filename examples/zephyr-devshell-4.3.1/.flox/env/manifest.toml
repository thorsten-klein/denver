schema-version = "1.14.0"

# denver's `import: [../zephyr-devshell]`. flox's `[include] environments` is
# a real named-sibling composition mechanism -- one of only two in this
# comparison (with devenv's Nix module `imports`) that reproduces denver's
# layering rather than flattening it (devbox, pixi) or replacing it with
# implicit parent-directory merging (mise).
#
# Note what had to exist for this to work at all: the included env needs its
# own `.flox/env.json`, generated by `flox init` and committed to git. A
# manifest alone is not an environment -- see ../../PORTING-flox.md.
[include]
environments = [
  { dir = "../zephyr-devshell" },
]

[install]
# Everything else -- python, uv, cmake, ninja, gcc, dtc, gperf -- is inherited
# from the included base above. Only version-specific pins belong here.
#
# west is deliberately NOT installed from the catalog: it is a python package,
# and pinning it here would put it outside the venv that Zephyr's own build
# scripts import from. It is installed with uv in the hook below instead, the
# same way the devbox port does it.

[vars]
ZEPHYR_VERSION = "4.3.1"

[hook]
# GAP (hard) -- stages 4 and 5. denver ran `west update` (clone ~40 pinned
# repos), `west patches`, `west blobs`, and THEN installed whatever python
# packages the freshly-cloned modules turn out to declare (`west packages
# pip`) -- as ordered, fingerprinted stages, on entry.
#
# flox has a single on-activate hook and no task graph at all (no `depends`
# like mise, no `after`/`status` like devenv). So the ordering below is
# ordering-by-line-number in one shell script, and the `[ -d ... ]` guard is
# hand-written because there is no per-step skip check. Without it this would
# re-run the whole setup on every single activation.
#
# `--seed` is load-bearing: uv does not put a pip in the venv otherwise, and
# Zephyr's build-time packages have to be installed imperatively (they are not
# knowable until west update has run), which needs one.
on-activate = '''
  VENV="$FLOX_ENV_CACHE/venv"
  if [ ! -d "$VENV" ]; then
    uv venv --seed "$VENV"
    uv pip install --python "$VENV/bin/python" -q west conan
  fi
  # PATH is exported HERE, not in [profile], and that distinction is a
  # finding rather than a style choice. [profile] is sourced by *your shell*,
  # so it does not run under `flox activate -- <command>` -- the non-
  # interactive form, and the one that corresponds to denver's
  # `denver <env> -- <command>`. Putting the venv on PATH in [profile] left
  # `west` missing in exactly that mode. [hook] exports do propagate to both.
  export VIRTUAL_ENV="$VENV"
  export PATH="$VENV/bin:$PATH"
'''

[options]
systems = ["x86_64-linux"]
