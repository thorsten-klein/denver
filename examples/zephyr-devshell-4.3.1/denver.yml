version: 1.0

# Inherit providers, shared conan setup and environment from the base devshell.
import:
- ../zephyr-devshell

# Version-specific bits only. Everything else comes from the imported base.

# Lockfile pattern: 'requirements.final.txt' below is not hand-written -- it's
# generated by the 'pip-zephyr' stage further down (its 'freeze-to:' writes the
# fully-resolved `uv pip freeze` output there once `west packages pip` has run),
# then read back in here so a fresh clone gets those exact pinned versions
# without needing to run `west packages pip` first. Regenerate it by running
# denver once and committing the resulting diff. On a merge conflict in this
# file, don't hand-resolve it: take either side, re-run denver on the merged
# branch, and commit the regenerated file instead.
pip:
  python: "3.12.3"
  requirements:
  - conan/recipes/python-cache/denver/requirements.txt
  - conan/recipes/python-cache/denver/requirements.final.txt
  overrides:
  - conan/recipes/python-cache/denver/overrides.txt
  # both declared explicitly: denver never picks a skip-if script or a
  # venv-patcher patches file up off the directory layout on its own.
  skip-if:
  - pip/skip-if.sh
  venv-patcher:
    patches: pip/venv-patcher/patches.yml

conan:
  conanfiles:
  - conan/conanfile.py
  # the shared base's own recipe-dirs (../zephyr-devshell/conan/recipes) are
  # kept automatically -- a list appends onto a lower layer's, it doesn't
  # replace it -- so only this version's own addition needs listing here.
  recipe-dirs:
  - conan/recipes

zephyr:
  # auto-generated list of west blobs to pre-cache
  blobs-cache: conan/recipes/west-blobs-cache/denver/blobs.txt

# `west packages pip` supplies its own requirements dynamically; this only
# needs the same override pins the main pip stage uses (not inherited
# automatically -- see src/providers/pip.py's module docstring).
pip-zephyr:
  install-args:
  - $(west packages pip)
  overrides:
  - conan/recipes/python-cache/denver/overrides.txt
  # frozen, fully-resolved python requirements are written back here
  freeze-to: conan/recipes/python-cache/denver/requirements.final.txt
  # this stage shares the 'pip' stage's venv, so it applies the same
  # skip-if/patches -- but it has to say so itself, exactly like 'pip' above.
  skip-if:
  - pip/skip-if.sh
  venv-patcher:
    patches: pip/venv-patcher/patches.yml
