version: 1.0
# minimum denver (the tool) this env needs -- see doc/configuration/denver-toml.md
denver-version: ">=1.6.0"

# Inherit providers, shared conan setup and environment from the base devshell.
import:
- ../zephyr-devshell

# Version-specific bits only. Everything else comes from the imported base.

# Lockfile pattern: 'requirements.final.txt' below is not hand-written -- it's
# generated by the 'uv-zephyr' stage further down (its 'freeze-to:' writes the
# fully-resolved `uv pip freeze` output there once `west packages pip` has run),
# then read back in here so a fresh clone gets those exact pinned versions
# without needing to run `west packages pip` first. Regenerate it by running
# denver once and committing the resulting diff. On a merge conflict in this
# file, don't hand-resolve it: take either side, re-run denver on the merged
# branch, and commit the regenerated file instead.
uv:
  python: "3.12.3"
  # install offline inside the container: the 'conan' stage before this one
  # provides a full wheel cache (UV_FIND_LINKS, from the python-cache recipe),
  # so there is nothing to fetch from an index in there. 'auto' still resolves
  # to false on the host, where that cache is not on PATH -- and it has to be
  # said explicitly, because the default is a plain online install.
  no-index: auto
  requirements:
  - conan/recipes/python-cache/denver/requirements.txt
  - conan/recipes/python-cache/denver/requirements.final.txt
  overrides:
  - conan/recipes/python-cache/denver/overrides.txt
  # both declared explicitly: denver never picks a skip-on-success script or a
  # venv-patcher patches command up off the directory layout on its own.
  skip-on-success:
  - uv/skip-on-success.sh
  patches-apply:
  - venv-patcher
  - apply
  - -f
  - uv/venv-patcher/patches.yml

conan:
  # the conanfile, plus every recipe dir it installs from. The shared base
  # declares no 'recipes:' entry of its own (it has no conanfile), so its
  # recipes are listed here explicitly, base first.
  conanfile: conan/conanfile.py
  recipes:
  - dirs:
    - ../zephyr-devshell/conan/recipes
    - conan/recipes
    # write this entry's catalog (every recipe pinned as
    # name/version@user/channel#rrev) so the pins are reviewable in a diff.
    # Drop this line and the catalog is built in memory only.
    catalog: conan/catalog.yml

zephyr:
  # Declared, not left to the default: 'west-yml:' otherwise resolves to
  # <outermost .git>/west.yml -- the manifest of the super-repo a real project
  # embeds this env in, which a standalone checkout of the denver repo (CI, or
  # anyone cloning it to try the examples) does not have. The env ships its
  # own manifest instead, so it runs anywhere; see the comments in west.yml.
  west-yml: west.yml
  # auto-generated list of west blobs to pre-cache
  blobs-cache: conan/recipes/west-blobs-cache/denver/blobs.txt

# `west packages pip` supplies its own requirements dynamically; this only
# needs the same override pins the main uv stage uses (not inherited
# automatically -- see src/denver_providers/uv.py's module docstring).
uv-zephyr:
  # same offline install as the 'uv' stage above -- and, like everything
  # else here, it has to say so itself rather than inherit it from that stage.
  no-index: auto
  install-args:
  - $(west packages pip)
  overrides:
  - conan/recipes/python-cache/denver/overrides.txt
  # frozen, fully-resolved python requirements are written back here
  freeze-to: conan/recipes/python-cache/denver/requirements.final.txt
  # this stage shares the 'uv' stage's venv, so it applies the same
  # skip-on-success/patches -- but it has to say so itself, exactly like 'uv' above.
  skip-on-success:
  - uv/skip-on-success.sh
  patches-apply:
  - venv-patcher
  - apply
  - -f
  - uv/venv-patcher/patches.yml
