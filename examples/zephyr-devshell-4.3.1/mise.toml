# Port of this folder's denver.yml to mise (https://mise.jdx.dev).
# Written to spec and NOT executed -- see ../PORTING-mise.md.
#
# denver original: five stages, inheriting ../zephyr-devshell via `import:`
# and restating only the 4.3.1 pins.
#
# NOTE ON LAYOUT: this file cannot actually inherit ../zephyr-devshell/mise.toml
# where it sits, because mise merges configs from PARENT directories, not
# from named siblings. Everything the base contributed is therefore
# duplicated below. To get real inheritance this folder would have to be
# moved to ../zephyr-devshell/4.3.1/ -- see the long comment in
# ../zephyr-devshell/mise.toml.

[settings]
# Required to install python 3.12.3 at all: mise verifies GitHub artifact
# attestations by default, and the python-build-standalone release for
# 3.12.3 (2024-04-15) predates them, so the install fails outright with
# "No GitHub artifact attestations found".
#
# Worth noticing as a difference in kind: denver's uv stage pins 3.12.3
# because that is what the container ships, and uv simply fetches it. Here
# pinning an older interpreter means opting out of a supply-chain check.
python.github_attestations = false

[tools]
python = "3.12.3"
cmake = "latest"
ninja = "latest"
ccache = "latest"

[tools."pipx:west"]
version = "latest"

# NOT DECLARED, AND THAT IS THE POINT -- gcc, g++, dtc (device-tree-compiler)
# and gperf all have to be on the host already for this build to work; they
# came from apt when this port was verified. native_sim compiles for the
# host, and mise has no backend for a C toolchain or for distro packages, so
# unlike the pixi port (which takes gcc/dtc/gperf from conda-forge) this
# environment is not self-contained. That is mise's documented gap showing
# up in practice rather than in prose.

[env]
# `--seed` is load-bearing: mise creates this venv with uv, which does not
# install pip into it by default. Zephyr's build-time python packages cannot
# be declared up front (see the west-packages task below), so they have to be
# installed imperatively into this venv -- which means it needs a pip inside
# it. Without --seed the install fails with "No module named pip".
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed"] }
CONAN_HOME = "{{config_root}}/.mise/conan2"
ZEPHYR_VERSION = "4.3.1"
# native_sim compiles for the host rather than with the Zephyr SDK.
ZEPHYR_TOOLCHAIN_VARIANT = "host"

# --- stages 4 and 5: where this stops being expressible --------------------
#
# denver ran `west update` (clone ~40 pinned repos), `west patches`,
# `west blobs`, and THEN installed whatever python packages the freshly
# cloned modules turn out to declare (`west packages pip`). mise's task
# graph can order these correctly, which is more than some tools in this
# comparison manage -- but:
#
# GAP -- these run on demand, not on entering the environment. denver ran
# them as part of activation, with per-stage fingerprinting so an unchanged
# workspace costs nothing and `--force` redoes it. Under mise, entering the
# directory gives you the tools and an empty workspace; whether the
# workspace is up to date is something you have to remember.
#
# GAP -- 'uv-zephyr' installed into the SAME venv as the 'uv' stage, on
# purpose, so west's own extension commands could import those packages in
# the same running west process. mise has one venv per config, so this
# happens to work -- but by accident rather than because it can be stated.
#
# GAP -- no equivalent of denver's `no-index: auto` offline install against
# the conan-provided wheel cache, of `venv-patcher:`, of `skip-if:`, or of
# `freeze-to:` writing requirements.final.txt back into the tree.

[tasks.west-init]
run = "west init -l ."

[tasks.west-update]
run = "west update"
depends = ["west-init"]

[tasks.west-blobs]
run = "west blobs fetch"
depends = ["west-update"]

[tasks.west-packages]
run = "uv pip install $(west packages pip)"
depends = ["west-update"]

[tasks.setup]
depends = ["west-update", "west-blobs", "west-packages"]
run = "echo 'workspace ready'"

# The build this port is verified against. See ../PORTING-mise.md for exactly
# what was and was not proven by it -- in particular, ZEPHYR_BASE points at a
# workspace mise did not create, because `west update` has to run before the
# python dependency set is even knowable.
[tasks.build-hello-world]
run = "west build -p always $ZEPHYR_BASE/samples/hello_world -b native_sim/native/64"
