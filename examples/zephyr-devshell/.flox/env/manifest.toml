schema-version = "1.14.0"

[install]
python3.pkg-path = "python3"
uv.pkg-path = "uv"
cmake.pkg-path = "cmake"
ninja.pkg-path = "ninja"
ccache.pkg-path = "ccache"
git.pkg-path = "git"

# native_sim compiles for the host, so a host toolchain is needed rather than
# a cross one. Taking these from the catalog rather than depending on whatever
# the machine happens to have is what makes this environment self-contained --
# the mise port of the same env has to borrow all three from apt.
gcc.pkg-path = "gcc"
dtc.pkg-path = "dtc"
gperf.pkg-path = "gperf"

[vars]
CONAN_HOME = "$FLOX_ENV_CACHE/conan2"
ZEPHYR_TOOLCHAIN_VARIANT = "host"

[hook]
# denver's base contributed hooks/env.sh, and every layer of the import chain
# adds its own rather than replacing it.
#
# NOT SOURCED HERE, AND THAT IS THE FINDING -- ../hooks/env.sh cannot be used
# outside denver at all. It derives its own location from $BASH_SOURCE (empty
# in a hook context) and reads WEST_TOPDIR and DENVER_ENV_WORKDIR, which are
# denver built-ins that exist nowhere else. Sourcing it here fails exactly as
# it did in the devbox port ("dirname: missing operand"). Its two
# machine-independent exports are inlined instead.
on-activate = '''
  export CMAKE_COLOR_DIAGNOSTICS=ON
  export CCACHE_NOHASHDIR=1
'''

[options]
systems = ["x86_64-linux"]
