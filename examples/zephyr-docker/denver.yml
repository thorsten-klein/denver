version: 1.0
# minimum denver (the tool) this env needs -- see doc/architecture.md
denver-version: ">=1.1.0"

# Runs the command inside a docker compose service. The 'docker' provider
# (src/providers/docker.py) runs env-scripts, builds the image and runs the
# service.
stages:
- docker

docker:
  provider: docker
  default-cmd: fish
  compose:
    file: docker-compose.yml
    service: dev
    build: true
  run-args:
  - "--rm"

  # create-env.sh generates the full compose env-file itself (dynamic bits:
  # host UID/GID, workspace, caches, git credentials, CI detection, conan
  # login, dir creation, ...); denver just runs it, with no arguments.
  env-scripts:
  - create-env.sh

  # host-side bootstrap (containerd/docker/make/jq/QEMU/udev rules); run via
  # `denver examples/zephyr-docker --run setup`, not on every normal run.
  scripts:
    setup:
    - setup/install_host_tools.sh
