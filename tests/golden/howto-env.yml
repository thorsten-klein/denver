version: '1.0'
denver-version: '>=1.1.0'
command: bash
hooks:
  env: null
  post-best-practices: null
  post-conan-packages: null
  post-docker-base: null
  post-nvim-setup: null
  post-uv-packages: null
  pre-best-practices: null
  pre-cmd: null
  pre-conan-packages: null
  pre-docker-base: null
  pre-nvim-setup: null
  pre-uv-packages: null
stages:
- docker-base
- uv-packages
- nvim-setup
- conan-packages
- best-practices
docker-base:
  provider: docker
  description:
  - Relocates every stage below into an Ubuntu 24.04 container, so the OS and the
    apt packages are the same for everyone.
  disabled: false
  scripts:
    setup:
    - setup/install_host_tools.sh
  compose:
    args: null
    build: true
    file: docker-compose.yml
    service: dev
  default-cmd: null
  env-scripts:
  - create-env.sh
  exe: docker
  image: null
  registries: null
  run-args:
  - --rm
uv-packages:
  provider: uv
  description:
  - The python 3.12 virtualenv. 'conan' is in requirements.txt because the next stage
    needs it on PATH -- the conan provider never installs it.
  disabled: false
  scripts: null
  append-mode: false
  find-links: null
  freeze-to: null
  install-args: null
  link-mode: copy
  lock: null
  no-index: false
  overrides: null
  python: 3.12.3
  requirements:
  - requirements.txt
  skip-if-0: []
  skip-if-1: []
  uv: /usr/bin/uv
  venv: null
  venv-patcher: null
nvim-setup:
  provider: custom
  description:
  - Brings one prebuilt binary release (neovim 0.12.4) into the environment the manual
    way -- download, checksum, unpack, PATH -- so the stage below can be read as what
    conan does with that same job.
  disabled: false
  scripts: null
  cmd: bash ${DENVER_ENV_DIR}/nvim/install.sh
  launcher: null
  source: nvim/activate.sh
conan-packages:
  provider: conan
  description:
  - Downloads cmake and the ARM toolchain at exactly the pinned versions and puts
    them on PATH. One unit -- a conanfile plus the recipes it installs. The same job
    as 'nvim-setup' above, minus the shell script -- conan owns the download, the
    checksum, the cache and the PATH.
  disabled: false
  scripts: null
  base-classes: []
  build: missing
  channel: snapshot
  cleanup-remotes: true
  conanfiles:
  - catalog: ''
    path: <REPO>/examples/howto-env/conan/conanfile.py
    recipe-dirs:
    - <REPO>/examples/howto-env/conan/recipes
    recipes-exporter: <REPO>/src/denver_providers/conan_scripts/recipes.py
  config: null
  deployer: <REPO>/src/denver_providers/conan_scripts/extensions/symlink.py
  exe: /usr/bin/conan
  install-args: null
  no-auth: false
  profiles:
    build: []
    host: []
  recipes-exporter: <REPO>/src/denver_providers/conan_scripts/recipes.py
  remotes: {}
  user: denver
best-practices:
  provider: custom
  description:
  - 'Team convention: pytest always verbose, with live logs. Declared as ''source:''
    rather than ''cmd:'', so the export survives into the final command.'
  disabled: false
  scripts: null
  cmd: null
  launcher: null
  source: best-practices.sh

