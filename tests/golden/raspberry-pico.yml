version: 1.0
denver-version: '>=1.1.0'
env:
  CONAN_HOME: ${DENVER_ENV_WORKDIR}/.conan2
hooks:
  env: null
  post-conan: null
  post-uv: null
  pre-cmd: null
  pre-conan: null
  pre-uv: null
stages:
- uv
- conan
uv:
  provider: uv
  description: null
  disabled: false
  scripts: null
  append-mode: false
  find-links: null
  freeze-to: null
  install-args: null
  link-mode: copy
  lock: null
  no-index: false
  overrides: null
  python: null
  requirements:
  - requirements.txt
  skip-if: []
  uv: /usr/bin/uv
  venv: null
  venv-patcher: null
conan:
  provider: conan
  description: null
  disabled: false
  scripts: null
  base-classes:
  - <REPO>/examples/zephyr-devshell/conan/base_classes
  build: missing
  channel: snapshot
  cleanup-remotes: true
  conanfiles:
  - catalog: <REPO>/examples/raspberry-pico/conan/catalog.yml
    path: <REPO>/examples/raspberry-pico/conan/conanfile.py
    recipe-dirs:
    - <REPO>/examples/raspberry-pico/conan/recipes
    - <REPO>/examples/zephyr-devshell/conan/recipes/cmake
    recipes-exporter: <REPO>/src/denver_providers/conan_scripts/recipes.py
  config: null
  deployer: <REPO>/src/denver_providers/conan_scripts/extensions/symlink.py
  exe: /usr/bin/conan
  install-args:
  - -c:a=tools.system.package_manager:mode=install
  - -c:a=tools.system.package_manager:sudo=True
  no-auth: false
  profiles:
    build: []
    host: []
  recipes-exporter: <REPO>/src/denver_providers/conan_scripts/recipes.py
  remotes: {}
  user: denver

