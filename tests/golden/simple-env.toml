version = "1.0"
denver-version = ">=1.5.1"
stages = [
  "print-vars-before",
  "set-vars",
  "print-vars-after",
]

[hooks]
# env = null
# post-print-vars-after = null
# post-print-vars-before = null
# post-set-vars = null
# pre-cmd = null
# pre-print-vars-after = null
# pre-print-vars-before = null
# pre-set-vars = null

[print-vars-before]
provider = "custom"
# description = null
disabled = false
skip-on-success = []
skip-on-failure = []
env = {}
env-prepend = {}
env-append = {}
# scripts = null
cmd = "echo \"[print-vars-before] MYVAR=$MYVAR FOO=$FOO BAR=$BAR\""
# launcher = null
# source = null

[set-vars]
provider = "custom"
# description = null
disabled = false
skip-on-success = []
skip-on-failure = []
env = {}
env-prepend = {}
env-append = {}
# scripts = null
cmd = "echo \"[set-vars] sourcing custom.sh...\""
# launcher = null
source = "custom.sh"

[print-vars-after]
provider = "custom"
# description = null
disabled = false
skip-on-success = []
skip-on-failure = []
env = {}
env-prepend = {}
env-append = {}
# scripts = null
cmd = "echo \"[print-vars-after] MYVAR=$MYVAR FOO=$FOO BAR=$BAR\""
# launcher = null
# source = null

