version: 1.0
denver-version: '>=1.6.0'
command: fish
env:
  JLINK_DIR: ${DENVER_ENV_WORKDIR}/jlink
  ZEPHYR_SDK_INSTALL_DIR: ${DENVER_ENV_WORKDIR}/download/zephyr-sdk-minimal
hooks:
  env:
  - <REPO>/examples/zephyr-devshell-4.3.1-simple/hooks/env.sh
  post-host-tools: null
  post-jlink: null
  post-native-tools: null
  post-uv: null
  post-uv-zephyr: null
  post-zephyr: null
  post-zephyr-sdk: null
  post-zephyr-sdk-download: null
  pre-cmd: null
  pre-host-tools: null
  pre-jlink: null
  pre-native-tools: null
  pre-uv: null
  pre-uv-zephyr: null
  pre-zephyr: null
  pre-zephyr-sdk: null
  pre-zephyr-sdk-download: null
stages:
- host-tools
- native-tools
- zephyr-sdk-download
- zephyr-sdk
- jlink
- uv
- zephyr
- uv-zephyr
host-tools:
  provider: custom
  description:
  - Checks the required apt packages are installed.
  disabled: false
  depends-on: []
  skip-on-success: []
  skip-on-failure: []
  env: {}
  env-prepend: {}
  env-append: {}
  scripts:
    setup:
    - setup/install_host_tools.sh
  cmd: bash ${DENVER_ENV_DIR}/setup/check_host_tools.sh
  launcher: null
  source: null
native-tools:
  provider: download
  description: null
  disabled: false
  depends-on: []
  skip-on-success: []
  skip-on-failure: []
  env: {}
  env-prepend: {}
  env-append: {}
  scripts: null
  packages:
  - description: ''
    env-append: {}
    env-prepend:
      PATH: '${DENVER_UNPACK_DIR}/bin:'
    md5sum: 7c102bf491091679895362bb8ae3f4bb
    mirrors: []
    name: cmake
    outfile: <REPO>/examples/zephyr-devshell-4.3.1-simple/.denver/denver/downloads/cmake-3.31.9-linux-x86_64.tar.gz
    sha256sum: ''
    unpack-cmd: tar -xf "$DENVER_DOWNLOAD_ARCHIVE" --strip-components=1
    unpack-dir: <REPO>/examples/zephyr-devshell-4.3.1-simple/.denver/denver/download/cmake
    url: https://github.com/Kitware/CMake/releases/download/v3.31.9/cmake-3.31.9-linux-x86_64.tar.gz
  - description: ''
    env-append: {}
    env-prepend:
      PATH: '${DENVER_UNPACK_DIR}:'
    md5sum: 54a25b8d5b5bed15c1bf051a629b42bb
    mirrors: []
    name: ninja
    outfile: <REPO>/examples/zephyr-devshell-4.3.1-simple/.denver/denver/downloads/ninja-linux.zip
    sha256sum: ''
    unpack-cmd: ''
    unpack-dir: <REPO>/examples/zephyr-devshell-4.3.1-simple/.denver/denver/download/ninja
    url: https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
  - description: clang, clang++, lld, plus a ld -> ld.lld symlink.
    env-append: {}
    env-prepend:
      PATH: '${DENVER_UNPACK_DIR}/bin:'
    md5sum: bc42e986dbe585461fb837542769bc7a
    mirrors: []
    name: clang
    outfile: <REPO>/examples/zephyr-devshell-4.3.1-simple/.denver/denver/downloads/LLVM-21.1.4-Linux-X64.tar.xz
    sha256sum: ''
    unpack-cmd: tar -xf "$DENVER_DOWNLOAD_ARCHIVE" --strip-components=1 && ln -sf
      ld.lld bin/ld
    unpack-dir: <REPO>/examples/zephyr-devshell-4.3.1-simple/.denver/denver/download/clang
    url: https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.4/LLVM-21.1.4-Linux-X64.tar.xz
  - description: The shell the final command hands off to.
    env-append: {}
    env-prepend:
      PATH: '${DENVER_UNPACK_DIR}:'
    md5sum: 921a8b099fa64d8565b27ffcb588c540
    mirrors: []
    name: fish
    outfile: <REPO>/examples/zephyr-devshell-4.3.1-simple/.denver/denver/downloads/fish-4.8.1-linux-x86_64.tar.xz
    sha256sum: ''
    unpack-cmd: ''
    unpack-dir: <REPO>/examples/zephyr-devshell-4.3.1-simple/.denver/denver/download/fish
    url: https://github.com/fish-shell/fish-shell/releases/download/4.8.1/fish-4.8.1-linux-x86_64.tar.xz
  - description: ''
    env-append: {}
    env-prepend:
      PATH: '${DENVER_UNPACK_DIR}/bin:'
    md5sum: 72f0b4d9b5280f28be54745a815d8a74
    mirrors: []
    name: doxygen
    outfile: <REPO>/examples/zephyr-devshell-4.3.1-simple/.denver/denver/downloads/doxygen-1.15.0.linux.bin.tar.gz
    sha256sum: ''
    unpack-cmd: tar -xf "$DENVER_DOWNLOAD_ARCHIVE" --strip-components=1
    unpack-dir: <REPO>/examples/zephyr-devshell-4.3.1-simple/.denver/denver/download/doxygen
    url: https://github.com/doxygen/doxygen/releases/download/Release_1_15_0/doxygen-1.15.0.linux.bin.tar.gz
  - description: ''
    env-append: {}
    env-prepend:
      PATH: '${DENVER_UNPACK_DIR}/bin:'
    md5sum: 6c39e1779a3b830f583214b691b4b7d4
    mirrors: []
    name: protoc
    outfile: <REPO>/examples/zephyr-devshell-4.3.1-simple/.denver/denver/downloads/protoc-33.2-linux-x86_64.zip
    sha256sum: ''
    unpack-cmd: ''
    unpack-dir: <REPO>/examples/zephyr-devshell-4.3.1-simple/.denver/denver/download/protoc
    url: https://github.com/protocolbuffers/protobuf/releases/download/v33.2/protoc-33.2-linux-x86_64.zip
  - description: ''
    env-append: {}
    env-prepend:
      PATH: '${DENVER_UNPACK_DIR}:'
    md5sum: c4e790c320566ec0bac903edf714af2f
    mirrors: []
    name: systemview
    outfile: <REPO>/examples/zephyr-devshell-4.3.1-simple/.denver/denver/downloads/SystemView_Linux_V362b_x86_64.tgz
    sha256sum: ''
    unpack-cmd: tar -xf "$DENVER_DOWNLOAD_ARCHIVE" --strip-components=1
    unpack-dir: <REPO>/examples/zephyr-devshell-4.3.1-simple/.denver/denver/download/systemview
    url: https://www.segger.com/downloads/jlink/SystemView_Linux_V362b_x86_64.tgz
