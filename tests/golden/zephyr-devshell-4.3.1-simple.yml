zephyr-sdk:
  provider: custom
  description:
  - Assembles the Zephyr SDK from the archives fetched above.
  disabled: false
  depends-on:
  - zephyr-sdk-download
  skip-on-success: []
  skip-on-failure: []
  env: {}
  env-prepend: {}
  env-append: {}
  scripts: null
  cmd: ${DENVER_ENV_DIR}/setup/setup_zephyr_sdk.sh
  launcher: null
  source: null
jlink:
  provider: custom
  description:
  - Downloads SEGGER J-Link (JLinkExe, JLinkGDBServerCLExe).
  disabled: false
  depends-on: []
  skip-on-success: []
  skip-on-failure: []
  env: {}
  env-prepend:
    LD_LIBRARY_PATH: '${JLINK_DIR}/bin:'
    PATH: '${JLINK_DIR}/bin:'
  env-append: {}
  scripts: null
  cmd: ${DENVER_ENV_DIR}/setup/download_jlink.sh
  launcher: null
  source: null
uv:
  provider: uv
  description: null
  disabled: false
  depends-on: []
  skip-on-success:
  - <REPO>/examples/zephyr-devshell-4.3.1-simple/uv/skip-on-success.sh
  skip-on-failure: []
  env: {}
  env-prepend: {}
  env-append: {}
  scripts: null
  amend: true
  exe: uv
  freeze-to: null
  install-args: null
  lockfile: null
  no-index: false
  overrides:
  - uv/overrides.txt
  patches-apply:
  - venv-patcher
  - apply
  - -f
  - <REPO>/examples/zephyr-devshell-4.3.1-simple/uv/venv-patcher/patches.yml
  python: 3.12.3
  requirements:
  - uv/requirements.txt
  - uv/requirements-from-git.txt
  venv: null
zephyr:
  provider: zephyr
  description: null
  disabled: false
  depends-on: []
  skip-on-success: []
  skip-on-failure: []
  env: {}
  env-prepend: {}
  env-append: {}
  scripts:
    setup:
    - setup/install_jlink_udev_rules.sh
  base: /fake-west-topdir/zephyr-rtos
  blobs-cache: null
  blobs-fetch-args:
  - --auto-accept
  exe: west
  patch-committer-date: '2000-01-01T00:00:00'
  patch-committer-email: denver@denver
  patch-committer-name: denver
  topdir: /fake-west-topdir
  update-args: null
  west-config: null
  west-yml: <REPO>/examples/zephyr-devshell-4.3.1-simple/west.yml
uv-zephyr:
  provider: uv
  description: null
  disabled: false
  depends-on: []
  skip-on-success: []
  skip-on-failure: []
  env: {}
  env-prepend: {}
  env-append: {}
  scripts: null
  amend: true
  exe: uv
  freeze-to: null
  install-args:
  - $(west packages pip)
  lockfile: null
  no-index: false
  overrides:
  - uv/overrides.txt
  patches-apply: null
  python: null
  requirements: null
  venv: null

