version = 1.0
denver-version = ">=1.5.1"
stages = [
  "docker",
  "conan",
  "uv",
  "zephyr",
  "uv-zephyr",
]

[hooks]
env = [
  "<REPO>/examples/zephyr-devshell/hooks/env.sh",
]
# post-conan = null
# post-docker = null
# post-uv = null
# post-uv-zephyr = null
# post-zephyr = null
# pre-cmd = null
# pre-conan = null
pre-docker = [
  "<REPO>/examples/zephyr-docker/create-env.sh",
]
# pre-uv = null
# pre-uv-zephyr = null
# pre-zephyr = null

[docker]
provider = "docker"
# description = null
disabled = false
skip-on-success = []
skip-on-failure = []
exe = "docker"
# registries = null

[docker.scripts]
setup = [
  "setup/install_host_tools.sh",
]

[docker.compose]
build = true
default-cmd = "fish"
file = "docker-compose.yml"
# image = null
run-args = [
  "--rm",
]
service = "dev"

[conan]
provider = "conan"
# description = null
disabled = false
skip-on-success = []
skip-on-failure = []
# scripts = null
authentication = true
base-classes = [
  "<REPO>/examples/zephyr-devshell/conan/base_classes",
]
build = "missing"
channel = "snapshot"
conanfile = "<REPO>/examples/zephyr-devshell-4.3.1/conan/conanfile.py"
# config = null
deployers = [
  "<REPO>/src/denver_providers/conan_scripts/extensions/symlink.py",
]
exe = "conan"
# install-args = null
keep-remotes = false
remotes = {}
user = "denver"

[conan.profiles]
build = []
host = []

[[conan.recipes]]
catalog = "<REPO>/examples/zephyr-devshell-4.3.1/conan/catalog.yml"
dirs = [
  "<REPO>/examples/zephyr-devshell/conan/recipes",
  "<REPO>/examples/zephyr-devshell-4.3.1/conan/recipes",
]
export-tool = "<REPO>/src/denver_providers/conan_scripts/recipes.py"

[uv]
provider = "uv"
# description = null
disabled = false
skip-on-success = [
  "<REPO>/examples/zephyr-devshell-4.3.1/uv/skip-on-success.sh",
]
skip-on-failure = []
# scripts = null
exe = "uv"
# freeze-to = null
# install-args = null
# lockfile = null
no-index = "auto"
overrides = [
  "conan/recipes/python-cache/denver/overrides.txt",
]
patches-apply = [
  "venv-patcher",
  "apply",
  "-f",
  "<REPO>/examples/zephyr-devshell-4.3.1/uv/venv-patcher/patches.yml",
]
python = "3.12.3"
reinstall = false
requirements = [
  "conan/recipes/python-cache/denver/requirements.txt",
  "conan/recipes/python-cache/denver/requirements.final.txt",
]
# venv = null

[zephyr]
provider = "zephyr"
# description = null
disabled = false
skip-on-success = []
skip-on-failure = []
base = "/fake-west-topdir/zephyr-rtos"
blobs-cache = "conan/recipes/west-blobs-cache/denver/blobs.txt"
blobs-fetch-args = [
  "--auto-accept",
]
exe = "west"
patch-committer-date = "2000-01-01T00:00:00"
patch-committer-email = "denver@denver"
patch-committer-name = "denver"
# update-args = null
# west-config = null
west-yml = "<REPO>/examples/zephyr-devshell-4.3.1/west.yml"

[zephyr.scripts]
setup = [
  "setup/install_jlink_udev_rules.sh",
]

[uv-zephyr]
provider = "uv"
# description = null
disabled = false
skip-on-success = [
  "<REPO>/examples/zephyr-devshell-4.3.1/uv/skip-on-success.sh",
]
skip-on-failure = []
# scripts = null
exe = "uv"
freeze-to = "conan/recipes/python-cache/denver/requirements.final.txt"
install-args = [
  "$(west packages pip)",
]
# lockfile = null
no-index = "auto"
overrides = [
  "conan/recipes/python-cache/denver/overrides.txt",
]
patches-apply = [
  "venv-patcher",
  "apply",
  "-f",
  "<REPO>/examples/zephyr-devshell-4.3.1/uv/venv-patcher/patches.yml",
]
# python = null
reinstall = false
# requirements = null
# venv = null

