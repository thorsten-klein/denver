version: 1.0
denver-version: '>=1.1.0'
hooks:
  env:
  - <REPO>/examples/zephyr-devshell/hooks/env.sh
  post-conan: null
  post-docker: null
  post-uv: null
  post-uv-zephyr: null
  post-zephyr: null
  pre-cmd: null
  pre-conan: null
  pre-docker: null
  pre-uv: null
  pre-uv-zephyr: null
  pre-zephyr: null
stages:
- docker
- conan
- uv
- zephyr
- uv-zephyr
docker:
  provider: docker
  description: null
  disabled: false
  scripts:
    setup:
    - setup/install_host_tools.sh
  compose:
    args: null
    build: true
    file: docker-compose.yml
    service: dev
  default-cmd: fish
  env-scripts:
  - create-env.sh
  exe: docker
  image: null
  registries: null
  run-args:
  - --rm
conan:
  provider: conan
  description: null
  disabled: false
  scripts: null
  base-classes:
  - <REPO>/examples/zephyr-devshell/conan/base_classes
  build: missing
  channel: snapshot
  cleanup-remotes: true
  conanfiles:
  - catalog: <REPO>/examples/zephyr-devshell-4.3.1/conan/catalog.yml
    path: <REPO>/examples/zephyr-devshell-4.3.1/conan/conanfile.py
    recipe-dirs:
    - <REPO>/examples/zephyr-devshell/conan/recipes
    - <REPO>/examples/zephyr-devshell-4.3.1/conan/recipes
    recipes-exporter: <REPO>/src/providers/conan_scripts/recipes.py
  config: null
  deployer: <REPO>/src/providers/conan_scripts/extensions/symlink.py
  exe: /usr/bin/conan
  install-args: null
  no-auth: false
  profiles:
    build: []
    host: []
  recipes-exporter: <REPO>/src/providers/conan_scripts/recipes.py
  remotes: {}
  user: denver
uv:
  provider: uv
  description: null
  disabled: false
  scripts: null
  append-mode: false
  find-links: null
  freeze-to: null
  install-args: null
  link-mode: copy
  lock: null
  no-index: false
  overrides:
  - conan/recipes/python-cache/denver/overrides.txt
  python: 3.12.3
  requirements:
  - conan/recipes/python-cache/denver/requirements.txt
  - conan/recipes/python-cache/denver/requirements.final.txt
  skip-if:
  - <REPO>/examples/zephyr-devshell-4.3.1/uv/skip-if.sh
  uv: /usr/bin/uv
  venv: null
  venv-patcher:
    exe: /usr/bin/venv-patcher
    patches: <REPO>/examples/zephyr-devshell-4.3.1/uv/venv-patcher/patches.yml
zephyr:
  provider: zephyr
  description: null
  disabled: false
  scripts:
    setup:
    - setup/install_jlink_udev_rules.sh
  base: /fake-west-topdir/zephyr-rtos
  blobs-cache: conan/recipes/west-blobs-cache/denver/blobs.txt
  blobs-fetch-args:
  - --auto-accept
  patch-committer:
    GIT_COMMITTER_DATE: '2000-01-01T00:00:00'
    GIT_COMMITTER_EMAIL: denver@denver
    GIT_COMMITTER_NAME: denver
  update-args: null
  west-config: null
  west-yml: <REPO>/examples/zephyr-devshell-4.3.1/west.yml
uv-zephyr:
  provider: uv
  description: null
  disabled: false
  scripts: null
  append-mode: false
  find-links: null
  freeze-to: conan/recipes/python-cache/denver/requirements.final.txt
  install-args:
  - $(west packages pip)
  link-mode: copy
  lock: null
  no-index: false
  overrides:
  - conan/recipes/python-cache/denver/overrides.txt
  python: null
  requirements: null
  skip-if:
  - <REPO>/examples/zephyr-devshell-4.3.1/uv/skip-if.sh
  uv: /usr/bin/uv
  venv: null
  venv-patcher:
    exe: /usr/bin/venv-patcher
    patches: <REPO>/examples/zephyr-devshell-4.3.1/uv/venv-patcher/patches.yml

