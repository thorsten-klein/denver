version = 1.0
denver-version = ">=1.5.1"
stages = [
  "docker",
]

[hooks]
# env = null
# post-docker = null
# pre-cmd = null
pre-docker = [
  "<REPO>/examples/zephyr-docker/create-env.sh",
]

[docker]
provider = "docker"
# description = null
disabled = false
skip-on-success = []
skip-on-failure = []
env = {}
env-prepend = {}
env-append = {}
scripts = { setup = ["setup/install_host_tools.sh"] }
exe = "docker"
# registries = null

[docker.compose]
build = true
default-cmd = "fish"
file = "docker-compose.yml"
# image = null
run-args = [
  "--rm",
]
service = "dev"

